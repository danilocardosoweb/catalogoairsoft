<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070908" />
    <meta name="description" content="Loadout Lab — experiência cinematográfica experimental da Field Ops." />
    <title>LOADOUT LAB — FIELD OPS</title>
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./loadout-lab.css" />
  </head>
  <body>
    <main class="lab-experience">
      <a class="lab-back" href="../../#loadout">Loadout atual <span>↗</span></a>

      <section class="lab-story" data-lab-story aria-labelledby="lab-title">
        <div class="lab-story-sticky">
          <div class="lab-scene" data-lab-scene aria-hidden="true">
            <div class="lab-operator-image"></div>
            <div class="lab-rifle-image"></div>
            <div class="lab-atmosphere"></div>
            <div class="lab-light-leak"></div>
          </div>

          <div class="lab-copy" data-lab-copy>
            <h1 id="lab-title">Monte seu<br /><em>loadout.</em></h1>
            <p>Seu equipamento. Sua configuração.</p>
          </div>

          <div class="lab-scroll-cue" data-scroll-cue>
            <span>Role para explorar</span>
            <b>↓</b>
          </div>
        </div>
      </section>

      <section class="lab-after-scene" aria-label="Próxima etapa do Loadout Lab">
        <a href="../../#loadout">Voltar para o Loadout atual <span>↗</span></a>
      </section>
    </main>
    <script src="./loadout-lab.js" defer></script>
  </body>
</html>
