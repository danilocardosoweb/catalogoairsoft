<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070908" />
    <meta name="description" content="Loadout Lab — experiência de vídeo controlada pelo scroll da Field Ops." />
    <title>LOADOUT LAB — FIELD OPS</title>
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./loadout-lab.css" />
  </head>
  <body>
    <main class="lab-experience">
      <a class="lab-back" href="../../#loadout">Loadout atual <span>↗</span></a>

      <section class="lab-story" data-lab-story aria-labelledby="lab-title">
        <div class="lab-story-sticky">
          <div class="lab-video-stage">
            <div class="lab-video-poster" aria-hidden="true"></div>
            <video
              class="lab-video"
              data-lab-video
              muted
              playsinline
              preload="auto"
              poster="./video-poster.jpg?rev=scroll-scrub-57"
              aria-label="Operador de airsoft avançando com seu equipamento"
            >
              <source src="./loadout-scroll.mp4?rev=scroll-scrub-57" type="video/mp4" />
            </video>
            <div class="lab-video-wash" aria-hidden="true"></div>
          </div>

          <div class="lab-copy" data-lab-copy>
            <h1 id="lab-title">Monte seu<br /><em>loadout.</em></h1>
            <p>Role para explorar</p>
          </div>

          <div class="lab-debug-panel" data-lab-debug hidden aria-live="polite">
            <span>Scroll progress: <b data-debug-progress>0.00</b></span>
            <span>Video duration: <b data-debug-duration>—</b></span>
            <span>Target time: <b data-debug-target>0.00</b></span>
            <span>Current time: <b data-debug-current>0.00</b></span>
            <span>FPS: <b data-debug-fps>—</b></span>
          </div>
        </div>
      </section>

      <section class="lab-after-scene" aria-label="Próxima etapa do Loadout Lab">
        <a href="../../#loadout">Voltar para o Loadout atual <span>↗</span></a>
      </section>
    </main>
    <script src="./loadout-lab.js?rev=scroll-scrub-57" defer></script>
  </body>
</html>
